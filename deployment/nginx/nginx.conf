# Reverse proxy for the Khmer support API (Phase 20).
#
#   brew install nginx
#   cp deployment/nginx/nginx.conf /opt/homebrew/etc/nginx/servers/khmerai.conf
#   nginx -t && brew services restart nginx
#
# Required only when the API is exposed beyond the trusted LAN. On a
# loopback-only deployment the API is reached directly on 127.0.0.1:8000.

upstream khmerai_api {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Per-IP rate limiting as a second layer. The API has its own token bucket; this
# one exists to shed abusive traffic before it reaches Python at all.
limit_req_zone $binary_remote_addr zone=khmerai_req:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=khmerai_conn:10m;

# Redirect plaintext to TLS.
server {
    listen 80;
    server_name khmerai.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name khmerai.internal;

    # --- TLS -----------------------------------------------------------------
    # Internal CA or Let's Encrypt. Generate a self-signed pair for a LAN pilot:
    #   openssl req -x509 -newkey rsa:4096 -nodes -days 365 \
    #     -keyout /opt/homebrew/etc/nginx/ssl/khmerai.key \
    #     -out /opt/homebrew/etc/nginx/ssl/khmerai.crt -subj "/CN=khmerai.internal"
    ssl_certificate     /opt/homebrew/etc/nginx/ssl/khmerai.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/khmerai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Matches KHMERAI_MAX_REQUEST_BYTES; reject oversized bodies at the edge.
    client_max_body_size 64k;
    client_body_timeout 15s;

    charset utf-8;
    charset_types application/json text/event-stream;

    access_log /usr/local/var/log/khmerai/nginx.access.log;
    error_log  /usr/local/var/log/khmerai/nginx.error.log warn;

    # --- streaming endpoint --------------------------------------------------
    # Buffering MUST be off here. With it on, nginx accumulates the whole SSE
    # response and the customer sees nothing until generation finishes, which
    # defeats the entire point of streaming.
    location /v1/chat/stream {
        limit_req zone=khmerai_req burst=10 nodelay;
        limit_conn khmerai_conn 4;

        proxy_pass http://khmerai_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;                      # gzip buffers, which also breaks SSE
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- ordinary API --------------------------------------------------------
    location /v1/ {
        limit_req zone=khmerai_req burst=10 nodelay;
        limit_conn khmerai_conn 8;

        proxy_pass http://khmerai_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 210s;       # > API client timeout (200s)
        proxy_connect_timeout 5s;
    }

    # --- admin: internal networks only ---------------------------------------
    location /v1/admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://khmerai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;       # a reindex can take minutes
    }

    # --- health: unauthenticated, not rate limited ---------------------------
    location = /health { proxy_pass http://khmerai_api; access_log off; }
    location = /ready  { proxy_pass http://khmerai_api; access_log off; }

    # --- metrics: never expose to the internet -------------------------------
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://khmerai_api;
        access_log off;
    }

    location / { return 404; }
}
