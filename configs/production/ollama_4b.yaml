extends: ../models/qwen35_4b.yaml

# =============================================================================
# Ollama runtime for the 4B on the Mac Studio (Phase 13)
# Starting points only - see configs/production/ollama_9b.yaml.
# =============================================================================
runtime:
  environment:
    OLLAMA_CONTEXT_LENGTH: 8192
    # Smaller weights leave more unified memory for KV cache, so the 4B should
    # sustain more parallel generations. Confirm by measurement.
    OLLAMA_NUM_PARALLEL: 8
    OLLAMA_MAX_QUEUE: 96
    OLLAMA_KEEP_ALIVE: -1
    OLLAMA_FLASH_ATTENTION: 1
    OLLAMA_KV_CACHE_TYPE: q8_0
    OLLAMA_MAX_LOADED_MODELS: 1

  generation:
    temperature: 0.3
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.05
    num_predict: 768

benchmark_matrix:
  parallel: [1, 2, 4, 6, 8, 10]
  context: [4096, 8192, 16384]
  clients: [1, 5, 10, 20]

measured: null
